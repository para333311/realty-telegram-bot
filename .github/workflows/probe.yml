name: (임시) booriny 조사

on:
  push:
    branches:
      - claude/naver-blog-telegram-feed-l86yaa

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe_booriny.py
        env:
          BOORINY_ID: ${{ secrets.BOORINY_ID }}
          BOORINY_PW: ${{ secrets.BOORINY_PW }}
