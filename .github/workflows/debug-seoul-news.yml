name: (임시) 서울시보도자료 API 점검

on:
  push:
    branches: ["claude/seoul-press-release-review-ikub6p"]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 보도자료 게시판 파싱 확인
        run: python debug_seoul_news.py
