name: 네이버 블로그 새 글 확인

on:
  schedule:
    # 정각/30분 정각은 GitHub 스케줄 혼잡으로 자주 밀리므로 7분/37분에 실행
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: blog-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests beautifulsoup4

      - name: 블로그 새 글 확인 및 알림 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_once.py

      - name: 구청 게시판 새 공고 확인 및 알림 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOARD_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python check_boards.py

      - name: 확인한 글 기록 저장
        run: |
          if [ -n "$(git status --porcelain seen.json seen_boards.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json seen_boards.json
            git commit -m "chore: 확인한 글 기록 업데이트"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
