name: 네이버 블로그 새 글 확인

# 이 워크플로는 30분마다 소스 5개(블로그·구청 게시판·부리니·카페·서울시보)를
# 순차로 확인하고, 새 글이 있으면 텔레그램으로 알린 뒤 확인 기록을 커밋한다.
#
# 비용: 2026-08-30 리포를 공개로 돌린 뒤로 0원·0분이다. 공개 리포의 액션은
# 무료 무제한이다. 그전(비공개)에는 이 워크플로 하나가 계정 월 한도 2,000분
# 중 1,801분(90%)을 먹었고, 그래서 8월 한 달 주기를 30분 → 2시간 → 6시간까지
# 늦춰야 했다. 그 제약은 이제 없다 — 주기를 다시 늦출 이유가 생긴다면
# 분 때문이 아니라 상대 사이트에 대한 예의 때문일 것이다.
#
# 아래 단계별 타임아웃은 2026-07-31·08-06 장애를 겪고 넣은 것이다(주석 참고).
# 분을 안 아껴도 되게 됐다고 되돌리지 마라 — 막는 사고가 다르다.

on:
  schedule:
    # 2026-08-30 리포를 공개로 돌렸다. 공개 리포의 액션은 무료 무제한이라
    # 이제 주기가 분(minute) 한도에 묶이지 않는다. 7월부터 쓰던 30분으로 복구.
    #
    # 그동안 있었던 일:
    #   · 30분 주기일 때 이 워크플로 하나가 계정 월 한도 2,000분 중
    #     1,801분(90%)을 먹고 있었다 (실행 718회 x 평균 2.9분)
    #   · 8/22 2시간으로 늦추고, 8월 잔량이 199분이라 다시 6시간까지 늦췄다
    #   · 공개 전환으로 그 제약이 통째로 사라졌다. 늦출 이유가 없어졌다
    #
    # 아래 단계별 타임아웃은 그대로 둔다. 2026-07-31·08-06 장애를 겪고 넣은
    # 것이라(주석 참고), 분을 안 아껴도 되게 됐다고 되돌릴 이유가 없다.
    #
    # 정각은 GitHub 스케줄 혼잡으로 자주 밀리므로 7분·37분에 실행한다.
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: blog-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # 아래 각 단계에 개별 타임아웃을 줬으므로(최악의 경우 합산 20분+여유),
    # job 타임아웃도 그만큼 넉넉히 잡아 record-save 단계까지 항상 도달하게 한다.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 매 실행 pip 가 인터넷에서 새로 받아오던 것을 캐시에서 꺼내 쓴다.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: pip install requests beautifulsoup4 pypdf

      # rss.blog.naver.com이 통째로 응답 없을 때(2026-07-31 확인) 이 단계가
      # job 전체 타임아웃까지 물고 늘어져 아래 무관한 소스(구청·부리니·카페·
      # 시보) 알림까지 연쇄로 스킵됐다. 단계별 타임아웃 + continue-on-error로
      # 이 단계만 포기하고 나머지는 계속 진행하게 한다.
      - name: 블로그 새 글 확인 및 알림 전송
        timeout-minutes: 6
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # 블로그 알림만 전용 채널(@jejeboard2)로 분리. BLOG_CHANNEL_ID가
          # 아직 등록 안 됐으면(신규 secret이라 없을 수 있음) 기존 개인 채팅으로
          # 폴백해 시크릿 설정 전에도 알림이 끊기지 않게 한다.
          TELEGRAM_CHAT_ID: ${{ secrets.BLOG_CHANNEL_ID || secrets.TELEGRAM_CHAT_ID }}
        run: python check_once.py

      # 재재보드 봇(구청 게시판·카페·서울시보 공용)이 보내는 알림은 전부 전용
      # 채널(@jejeboard3)로 분리. BOARD_CHANNEL_ID 미설정 시 기존 개인 채팅으로
      # 폴백해 시크릿 설정 전에도 알림이 끊기지 않는다.
      #
      # 2026-08-06 이 아래 네 단계 중 하나가 job 전체 타임아웃(당시 15분)까지
      # 물고 늘어져 실행 취소된 사례가 두 차례 확인됨(구청 사이트 중 만성
      # 타임아웃 나는 곳이 있음). 블로그 단계와 동일하게 단계별 타임아웃 +
      # continue-on-error를 걸어, 한 소스가 멈춰도 나머지와 기록 저장은
      # 계속 진행되게 한다.
      - name: 구청 게시판 새 공고 확인 및 알림 전송
        timeout-minutes: 6
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOARD_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BOARD_CHANNEL_ID || secrets.TELEGRAM_CHAT_ID }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python check_boards.py

      - name: 부리니 새 매물 확인 및 알림 전송
        timeout-minutes: 3
        continue-on-error: true
        env:
          BOORINY_ID: ${{ secrets.BOORINY_ID }}
          BOORINY_PW: ${{ secrets.BOORINY_PW }}
          BOORINY_BOT_TOKEN: ${{ secrets.BOORINY_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_booriny.py

      - name: 부동산스터디 카페 새 글 확인 및 알림 전송
        timeout-minutes: 4
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          BOARD_BOT_TOKEN: ${{ secrets.BOARD_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BOARD_CHANNEL_ID || secrets.TELEGRAM_CHAT_ID }}
        run: python check_cafe.py

      - name: 서울시보 재개발 관련 목차 확인 및 알림 전송
        timeout-minutes: 5
        continue-on-error: true
        env:
          BOARD_BOT_TOKEN: ${{ secrets.BOARD_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BOARD_CHANNEL_ID || secrets.TELEGRAM_CHAT_ID }}
        run: python check_sibo.py

      - name: 확인한 글 기록 저장
        # 중간 단계가 실패해도 이미 발송한 알림의 기록은 반드시 커밋한다
        # (기록이 누락되면 다음 실행에서 같은 알림이 중복 발송됨)
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen.json seen_boards.json seen_booriny.json seen_cafe.json seen_sibo.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json seen_boards.json seen_booriny.json seen_cafe.json seen_sibo.json
            git commit -m "chore: 확인한 글 기록 업데이트"
            # push가 GitHub 쪽 일시적 오류(예: commit_refs 오류)로 실패하면
            # 기록 누락 → 다음 실행 중복 알림으로 이어지므로 몇 차례 재시도한다.
            for attempt in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
              echo "push 실패, 재시도 $attempt/4"
              sleep $((attempt * 5))
            done
          fi
