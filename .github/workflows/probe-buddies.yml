name: (임시) 네이버 이웃목록 엔드포인트 탐침

# blogs.txt 자동 동기화가 가능한지 확인하려는 일회성 워크플로.
# 확인이 끝나면 tools/probe_buddy_endpoints.py와 함께 지운다.

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 이웃목록 엔드포인트 탐침
        env:
          MY_BLOG_ID: para333311
        run: python tools/probe_buddy_endpoints.py
