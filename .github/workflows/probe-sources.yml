name: (임시) 네프콘·카페 첫 실행

# check_jeje.py를 브랜치에서 한 번 실제로 돌려, 기준선(seen_jeje.json)을 만들고
# 알림이 실제로 나가는지 확인한다. 확인되면 이 워크플로는 지운다.

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 네프콘·카페 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BLOG_CHANNEL_ID || secrets.TELEGRAM_CHAT_ID }}
        run: python check_jeje.py
      - name: 기준선 커밋
        if: always()
        run: |
          if [ -n "$(git status --porcelain seen_jeje.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_jeje.json
            git commit -m "chore: 네프콘·카페 기준선 저장"
            git pull --rebase origin "$GITHUB_REF_NAME" && git push
          fi
